name: Java CI with Gradle

on:
  push:
    branches-ignore:
    - "dependabot/**"
    tags-ignore:
    - "**"
    paths:
    - "**.java"
    - "**.json"
    - "**.yml"
    - "gradle**"
    - "*.gradle"
    - "*.accesswidener"
  pull_request:
    paths:
    - "**.java"
    - "**.json"
    - "**.yml"
    - "gradle**"
    - "*.gradle"
    - "*.accesswidener"
  workflow_dispatch:
    inputs:
      distinct_id:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Echo distinct ID ${{ inputs.distinct_id }}
      run: echo ${{ inputs.distinct_id }}

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "microsoft"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        build-scan-publish: true
        build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
        build-scan-terms-of-use-agree: "yes"
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
        cache-read-only: ${{ github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/1.') }}

    - name: Resolve dependencies
      run: |
        max_attempts=3
        attempt=1
        until ./gradlew dependencies --stacktrace; do
          if [ $attempt -ge $max_attempts ]; then
            echo "Failed to resolve dependencies after $max_attempts attempts"
            exit 1
          fi
          echo "Attempt $attempt failed, retrying in 30 seconds..."
          attempt=$((attempt + 1))
          sleep 30
        done

    - name: Build
      run: ./gradlew build --stacktrace --warning-mode=fail

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Wurst
        path: build/libs/

    - name: Read data from gradle.properties
      id: read_properties
      uses: christian-draeger/read-properties@1.1.1
      with:
        path: './gradle.properties'
        properties: 'minecraft_version mod_version'

    - name: Trim whitespace from mod version
      run: echo "MOD_VERSION=$(echo ${{ steps.read_properties.outputs.mod_version }} | tr -d '[:space:]')" >> $GITHUB_ENV

    - name: Release
      uses: "ThisTestUser/marvinpinto-action-automatic-releases@1.0"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "v${{ steps.read_properties.outputs.minecraft_version }}"
        prerelease: false
        title: "Wurst Client - ThisTestUser's Edition for ${{ steps.read_properties.outputs.minecraft_version }}"
        files: |
          build/libs/Wurst-Client-${{ env.MOD_VERSION }}.jar
